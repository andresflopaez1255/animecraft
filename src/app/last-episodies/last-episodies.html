<section class="mt-8">
  <!-- Encabezado de la sección: Cubo verde + Título + EN DIRECTO -->
  <div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-2.5">
      <span class="w-2.5 h-4 bg-[#4ade80] rounded-[2px] inline-block shadow-[0_0_8px_rgba(74,222,128,0.5)]"></span>
      <h2 class="text-xl sm:text-2xl font-bold text-white tracking-tight">
        Últimos episodios
      </h2>
    </div>

    <!-- Badge EN DIRECTO con punto parpadeante verde -->
    <div class="flex items-center gap-1.5 text-xs font-bold text-[#4ade80] tracking-wider uppercase">
      <span class="w-2 h-2 rounded-full bg-[#4ade80] animate-pulse shadow-[0_0_8px_#4ade80]"></span>
      <span>EN DIRECTO</span>
    </div>
  </div>

  <!-- Cuadrícula de Episodios (2 columnas en móvil, 4 en desktop) -->
  <div class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
    @for (ep of episodes(); track ep.id) {
      <app-last-episodies-item [episode]="ep" />
    }
  </div>
</section>
