<article
  [routerLink]="['/anime', anime.id]"
  class="h-full group w-[180px] sm:w-[170px] shrink-0 flex flex-col gap-2 relative cursor-pointer"
>
    
    <!-- Poster Image Container -->
    <div class="relative w-full aspect-[2/3] rounded-xl overflow-hidden border border-white/5 shadow-md">
        <img [src]="anime.coverImage.large" class="h-full w-full object-cover transition duration-300 group-hover:scale-105" [alt]="anime.title" />
        
        <!-- Top Left Badge -->
        <div class="absolute top-2 left-2 px-2 py-0.5 rounded text-[10px] font-bold tracking-wide border border-white/10" 
             [class]="anime.format">
            {{ anime.format }}
        </div>
        
        <!-- Subtle Bottom Gradient to make images pop -->
        <div class="absolute inset-x-0 bottom-0 h-1/3 bg-gradient-to-t from-black/60 to-transparent pointer-events-none"></div>
    </div>
    
    <!-- Info Section below poster -->
    <div class="flex items-start gap-2 px-1">
        
        <!-- Large Golden Number -->
        <span class="text-[52px] leading-[0.75] font-black text-[#d8c99b] drop-shadow-md tracking-tighter shrink-0 pt-2">
            {{ index + 1 }}
        </span>
        
        <!-- Title and Rating -->
        <div class="flex flex-col min-w-0 pt-2">
            <h5 class="text-white text-[13px] font-bold truncate tracking-tight">
                {{ anime.title.userPreferred }}
            </h5>
            <span class="text-[#a0a5a3] text-[11px] font-medium mt-0.5 flex items-center gap-1">
                <span class="text-[#d8c99b]">★</span> {{ anime.averageScore }} • {{ anime.genres[0] }}
            </span>
        </div>
        
    </div>

</article>
