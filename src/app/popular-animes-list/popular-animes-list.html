<section class="mb-6">
  <app-section-title title="Anime Populares" subtitle="Esta semana" />

  <div
    class="flex gap-4 overflow-x-auto scrollbar-hide touch-pan-x"
    (wheel)="onWatchlistWheel($event)"
  >
    @for (anime of animesList(); track anime.id; let i = $index) {
      <a [routerLink]="['/anime', anime.id]">
        <app-popular-animes-item
          [anime]="anime"
          [index]="i"
        />
      </a>
    }
  </div>
</section>
