<section class="relative h-[600px] lg:h-[700px] pt-20 w-full overflow-hidden bg-[#111312]"
  (touchstart)="onTouchStart($event)" 
  (touchend)="onTouchEnd($event)"
  (mousedown)="onMouseDown($event)" 
  (mouseup)="onMouseUp($event)">

  <!-- ESTA ES LA LÍNEA QUE TE FALTÓ: Crea un loop de los animes y nos da la variable 'i' -->
  @for (item of bannerItems(); track item.title; let i = $index) {
  
    <div 
      class="absolute inset-0 w-full h-full transition-opacity duration-1000 ease-in-out"
      [class.opacity-100]="i === bannerCurrentIndex()"
      [class.opacity-0]="i !== bannerCurrentIndex()"
      [class.z-10]="i === bannerCurrentIndex()"
      [class.pointer-events-none]="i !== bannerCurrentIndex()"
    >
      <!-- IMPORTANTE: Cambia "bannerItems()[bannerCurrentIndex()].bannerImage" 
           simplemente por "item.bannerImage", ya que el loop te da el "item" directo -->
      <img class="h-full w-full absolute inset-0 object-cover bg-center"
           [src]="item.bannerImage" />

      <!-- Dark overlay -->
      <div class="absolute inset-0 bg-gradient-to-r from-[#111312] via-[#111312e8] to-[#11131240]"></div>

      <!-- Bottom fade -->
      <div class="absolute inset-x-0 bottom-0 h-48 bg-gradient-to-t from-[#111312] to-transparent"></div>

      <!-- Content -->
      <div class="relative z-10 flex min-h-[550px] max-w-3xl flex-col justify-center px-6 pt-24 pb-12 sm:px-10 lg:px-14">

        <!-- Metadata -->
        <div class="mb-4 flex flex-wrap items-center gap-3">
          <span class="rounded bg-[#8ee36b] px-2 py-1 text-[11px] font-bold uppercase tracking-wide text-[#14200f] flex items-center gap-1">
            <span class="w-1.5 h-1.5 bg-[#14200f] rounded-full"></span>
            #1 TOP HOY
          </span>

          <span class="rounded bg-[#14200f] px-2 py-1 text-[11px] font-bold uppercase tracking-wide text-white flex items-center gap-1">
            <span class="w-1.5 h-1.5 bg-white rounded-full"></span>
            {{ item.episodeCount }} Episodios
          </span>
        </div>

        <!-- Title -->
        <h1 class="mt-4 max-w-2xl text-[40px] font-bold uppercase leading-[1.1] tracking-tight text-white sm:text-3xl lg:text-[44px]">
          {{ item.title || item.title }}
        </h1>

        <h1 class="mt-2 max-w-2xl text-md leading-[1.1] tracking-tight text-white sm:text-5xl lg:text-[18px]">
          {{ item.description?.slice(0,300) }}...
        </h1>

        <!-- Actions -->
        <div class="mt-12 flex flex-wrap items-center gap-3">
          <button type="button" class="inline-flex items-center gap-2 rounded-lg bg-[#8ee36b] px-8 py-3.5 text-[13px] font-bold text-[#13200f] transition hover:bg-[#a0ed82]">
            <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
              <path d="M6.3 4.5a1 1 0 0 1 1.5-.86l7.5 5a1 1 0 0 1 0 1.72l-7.5 5A1 1 0 0 1 6.3 14.5v-10Z" />
            </svg>
            Ver ahora
          </button>

          <button type="button" class="inline-flex items-center gap-2 rounded-lg bg-[#1c1f1e] border border-white/5 px-6 py-3.5 text-[13px] font-bold text-white transition hover:bg-[#252a29]">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 5.5A2.5 2.5 0 0 1 7.5 3h9A2.5 2.5 0 0 1 19 5.5V21l-7-4-7 4V5.5Z" />
            </svg>
            Mi lista
          </button>
        </div>

        <!-- Genres -->
        <div class="mt-12 flex flex-wrap gap-3">
          @for (genre of item.genres; track genre) {
            <span class="rounded-full bg-[#1c1f1e] px-4 py-1.5 text-[12px] font-medium text-[#d0d0d0] border border-white/5">
              {{ genre }}
            </span>
          }
        </div>

      </div>
    </div>
  
  <!-- CIERRE DEL LOOP -->
  }
  
</section>
